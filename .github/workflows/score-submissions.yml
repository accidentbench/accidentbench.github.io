name: Score Submissions

on:
  push:
    branches:
      - main
    paths:
      - "submissions/**/*.csv"
  workflow_dispatch:
    inputs:
      submission_path:
        description: "Path to a submission CSV in the repo"
        required: true
        type: string
      benchmark:
        description: "Benchmark leaderboard to update"
        required: true
        type: choice
        options:
          - iid
          - geo-aware
          - zero-shot

permissions:
  contents: write
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Resolve submission path
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "submission=${{ github.event.inputs.submission_path }}" >> "$GITHUB_OUTPUT"
            echo "benchmark=${{ github.event.inputs.benchmark }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              submission=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^submissions/.*\.csv$' | tail -n 1)
            else
              submission=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep '^submissions/.*\.csv$' | tail -n 1)
            fi
            if [ -z "$submission" ]; then
              echo "No submission CSV found in this push."
              exit 1
            fi
            benchmark=$(echo "$submission" | cut -d/ -f2)
            echo "submission=$submission" >> "$GITHUB_OUTPUT"
            echo "benchmark=$benchmark" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract merged PR metadata
        id: pr_metadata
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                per_page: 100,
              }
            );

            const pr = pulls.find((item) => item.merged_at) || pulls[0];
            if (!pr) {
              core.setFailed(`No pull request associated with commit ${sha}.`);
              return;
            }

            const body = pr.body || "";
            const match = body.match(/```yaml([\s\S]*?)```/);
            if (!match) {
              core.setFailed("Merged PR does not contain the required submission metadata YAML block.");
              return;
            }

            const parsed = {};
            for (const rawLine of match[1].split("\n")) {
              const line = rawLine.trim();
              if (!line || !line.includes(":")) continue;
              const [key, ...rest] = line.split(":");
              parsed[key.trim()] = rest.join(":").trim();
            }

            const fs = require("fs");
            fs.mkdirSync("scoring-results", { recursive: true });
            fs.writeFileSync("scoring-results/pr-metadata.json", JSON.stringify(parsed, null, 2));
            core.setOutput("pr_number", String(pr.number));

      - name: Score submission
        run: |
          python scripts/metrics.py \
            --submission "${{ steps.resolve.outputs.submission }}" \
            --labels data/labels.csv \
            --output "scoring-results/result.json"

      - name: Update leaderboard JSON
        run: |
          python scripts/update_leaderboard.py \
            --scores scoring-results/result.json \
            --submission "${{ steps.resolve.outputs.submission }}" \
            --benchmark "${{ steps.resolve.outputs.benchmark }}" \
            --metadata scoring-results/pr-metadata.json \
            --leaderboard "data/leaderboards/${{ steps.resolve.outputs.benchmark }}.json"

      - name: Upload scoring artifact
        uses: actions/upload-artifact@v4
        with:
          name: scoring-result
          path: scoring-results/result.json

      - name: Create leaderboard PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update ${{ steps.resolve.outputs.benchmark }} leaderboard"
          title: "Update ${{ steps.resolve.outputs.benchmark }} leaderboard"
          body: |
            Automated leaderboard update for `${{ steps.resolve.outputs.submission }}`.

            Source submission PR: #${{ steps.pr_metadata.outputs.pr_number }}

            This PR was created by the scoring workflow after evaluating the submission against `data/labels.csv`.
          branch: "bot/leaderboard-${{ steps.resolve.outputs.benchmark }}"
          add-paths: |
            data/leaderboards/${{ steps.resolve.outputs.benchmark }}.json
