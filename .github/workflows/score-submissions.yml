name: Score Submissions

on:
  push:
    branches:
      - main
    paths:
      - "submissions/**/*.csv"
  workflow_dispatch:
    inputs:
      submission_path:
        description: "Path to a submission CSV in the repo"
        required: true
        type: string
      benchmark:
        description: "Benchmark leaderboard to update"
        required: true
        type: choice
        options:
          - iid
          - ood
          - zero-shot
      pr_number:
        description: "Merged submission PR number for manual recovery runs"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Resolve submission path
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "submission=${{ github.event.inputs.submission_path }}" >> "$GITHUB_OUTPUT"
            echo "benchmark=${{ github.event.inputs.benchmark }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              submission=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^submissions/.*\.csv$' | tail -n 1)
            else
              submission=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep '^submissions/.*\.csv$' | tail -n 1)
            fi
            if [ -z "$submission" ]; then
              echo "No submission CSV found in this push."
              exit 1
            fi
            benchmark=$(echo "$submission" | cut -d/ -f2)
            echo "submission=$submission" >> "$GITHUB_OUTPUT"
            echo "benchmark=$benchmark" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract merged PR metadata
        id: pr_metadata
        uses: actions/github-script@v7
        with:
          script: |
            const submissionPath = "${{ steps.resolve.outputs.submission }}";
            const manualPrNumber = "${{ github.event.inputs.pr_number || '' }}".trim();
            let pr = null;

            if (context.eventName === "workflow_dispatch" && manualPrNumber) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(manualPrNumber),
              });
              pr = response.data;

              if (!pr.merged_at) {
                core.setFailed(`Pull request #${manualPrNumber} is not merged.`);
                return;
              }

              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100,
                }
              );

              const touchedSubmission = files.some((file) => file.filename === submissionPath);
              if (!touchedSubmission) {
                core.setFailed(`Pull request #${manualPrNumber} does not include submission '${submissionPath}'.`);
                return;
              }
            } else {
              const sha = context.sha;
              const pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: sha,
                  per_page: 100,
                }
              );

              pr = pulls.find((item) => item.merged_at) || pulls[0];
            }

            if (!pr) {
              core.setFailed(
                context.eventName === "workflow_dispatch"
                  ? "No submission pull request could be resolved. Provide pr_number for manual recovery runs."
                  : `No pull request associated with commit ${context.sha}.`
              );
              return;
            }

            const body = pr.body || "";
            const match = body.match(/```yaml([\s\S]*?)```/);
            if (!match) {
              core.setFailed("Merged PR does not contain the required submission metadata YAML block.");
              return;
            }

            const parsed = {};
            for (const rawLine of match[1].split("\n")) {
              const line = rawLine.trim();
              if (!line || !line.includes(":")) continue;
              const [key, ...rest] = line.split(":");
              parsed[key.trim()] = rest.join(":").trim();
            }

            const fs = require("fs");
            fs.mkdirSync("scoring-results", { recursive: true });
            fs.writeFileSync("scoring-results/pr-metadata.json", JSON.stringify(parsed, null, 2));
            core.setOutput("pr_number", String(pr.number));

      - name: Score submission
        run: |
          python scripts/metrics.py \
            --submission "${{ steps.resolve.outputs.submission }}" \
            --labels data/labels.csv \
            --benchmark "${{ steps.resolve.outputs.benchmark }}" \
            --output "scoring-results/result.json"

      - name: Update leaderboard bundle
        run: |
          python scripts/update_leaderboard.py \
            --scores scoring-results/result.json \
            --submission "${{ steps.resolve.outputs.submission }}" \
            --benchmark "${{ steps.resolve.outputs.benchmark }}" \
            --metadata scoring-results/pr-metadata.json \
            --bundle "data/leaderboards.js"

      - name: Upload scoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scoring-results-${{ steps.resolve.outputs.benchmark }}
          path: |
            scoring-results/result.json
            scoring-results/pr-metadata.json
            data/leaderboards.js
